<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VisionAI Ótica</title>

<!-- Ícone da aba -->
<link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/icon.jpeg') }}">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Segoe UI', sans-serif;

  /* Fundo de tela inteira */
  background: url("{{ url_for('static', filename='fundo.png') }}") no-repeat center center fixed;
  background-size: cover;
}

/* Ícone flutuante solto */
.float-icon {
  position: fixed;
  bottom: 50px;
  right: 50px;
  width: 120px;
  height: 120px;
  cursor: pointer;
  animation: pulse 1.5s infinite; /* animação de pulso */
  z-index: 1000;
}

/* Ícone redondo */
.float-icon img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.3s;
}

.float-icon:hover img {
  transform: scale(1.15);
}

/* Texto de alerta/boas-vindas */
.float-text {
  position: fixed;
  bottom: 180px; /* acima do ícone */
  right: 55px;
  font-size: 22px;
  font-weight: 600;
  color: rgb(57, 6, 179);
  text-shadow: 0 0 10px rgba(0,0,0,0.7);
  opacity: 0;
  animation: fadeInOut 2s infinite;
  pointer-events: none; /* não bloqueia clique no ícone */
}

/* Animação de pulso */
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* Texto piscando suavemente */
@keyframes fadeInOut {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}
</style>
</head>

<body>

<!-- Texto de boas-vindas piscando -->
<div class="float-text">Bem Vindo!</div>

<!-- Ícone flutuante -->
<a href="/paciente" class="float-icon">
  <img src="{{ url_for('static', filename='icon.jpeg') }}" alt="Ícone">
</a>

</body>
</html>
