<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VisionAI Ótica</title>

<!-- Ícone -->
<link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='icon.jpeg') }}">

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* 🔥 FUNDO CORRETO (resolve mobile) */
.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: url("{{ url_for('static', filename='fundo.png') }}") center center no-repeat;
  background-size: cover;

  z-index: -1;
}

/* BODY */
body {
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* 🔥 CORREÇÃO iOS SAFARI */
@supports (-webkit-touch-callout: none) {
  body {
    min-height: -webkit-fill-available;
  }
}

/* ÍCONE FLUTUANTE */
.float-icon {
  position: fixed;
  bottom: calc(5vh + env(safe-area-inset-bottom));
  right: 5vw;

  width: 120px;
  height: 120px;

  cursor: pointer;
  animation: pulse 1.5s infinite;
  z-index: 1000;
}

/* IMAGEM */
.float-icon img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.3s;
}

.float-icon:hover img {
  transform: scale(1.15);
}

/* TEXTO */
.float-text {
  position: fixed;
  bottom: 22vh;
  right: 5vw;

  font-size: 22px;
  font-weight: 600;
  color: rgb(57, 6, 179);

  text-shadow: 0 0 10px rgba(0,0,0,0.7);
  opacity: 0;
  animation: fadeInOut 2s infinite;

  pointer-events: none;
}

/* ANIMAÇÕES */
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

@keyframes fadeInOut {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

/* 📱 MOBILE */
@media (max-width: 768px) {
  .float-icon {
    width: 80px;
    height: 80px;
    bottom: calc(4vh + env(safe-area-inset-bottom));
    right: 4vw;
  }

  .float-text {
    font-size: 16px;
    bottom: 18vh;
    right: 4vw;
  }
}

/* 📱 SMALL MOBILE */
@media (max-width: 480px) {
  .float-icon {
    width: 65px;
    height: 65px;
  }

  .float-text {
    font-size: 14px;
  }
}

/* 💻 TABLET */
@media (min-width: 769px) and (max-width: 1024px) {
  .float-icon {
    width: 100px;
    height: 100px;
  }

  .float-text {
    font-size: 18px;
  }
}

</style>
</head>

<body>

<!-- 🔥 FUNDO -->
<div class="bg"></div>

<!-- TEXTO -->
<div class="float-text">Bem Vindo!</div>

<!-- ÍCONE -->
<a href="/paciente" class="float-icon">
  <img src="{{ url_for('static', filename='icon.jpeg') }}" alt="Ícone">
</a>

</body>
</html>
