<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionAI • Medição Inteligente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='visionai.css') }}">
    
    <style>
/* ------------------ VARIÁVEIS ------------------ */
:root {
    --bg-paper: #f4f1ea;
    --bg-paper-texture: #ebe8df;
    --logo-blue: #00acc1;
    --logo-green: #1b5e20;
    --text-main: #212121;
    --text-sub: #616161;
    --card-bg: #ffffff;
    --border-light: rgba(0, 0, 0, 0.05);
    --transition: 0.3s ease;
}

/* ------------------ RESET GLOBAL ------------------ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden; /* 🔥 remove TODAS barras */
}

/* ------------------ BODY ------------------ */
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-main);

    display: flex;
    justify-content: center;
    align-items: center;

    /* Fundo */
    background-color: var(--bg-paper);
    background-image: url("{{ url_for('static', filename='image_16.png') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* ------------------ HEADER (opcional) ------------------ */
header {
    position: absolute;
    top: 20px;
    left: 20px;
}

.logo {
    font-size: 26px;
    font-weight: 800;
    color: var(--logo-blue);
}

nav {
    display: flex;
    gap: 5px;
}

nav a {
    text-decoration: none;
    color: var(--text-main);
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 12px;
    transition: var(--transition);
}

nav a:hover {
    background: rgba(0, 172, 193, 0.08);
    color: var(--logo-blue);
}

/* ------------------ MAIN ------------------ */
main {
    width: 100%;
    max-width: 520px;
    padding: 20px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ------------------ TEXTOS ------------------ */
h3 {
    margin-bottom: 20px;
    font-size: 18px;
    text-align: center;
}

h3 b {
    color: var(--logo-blue);
}

/* ------------------ VIDEO ------------------ */
.video-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border-light);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.video-container::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    border: 3px solid;
    border-image: linear-gradient(135deg, var(--logo-blue), var(--logo-green)) 1;
    pointer-events: none;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* ------------------ OUTPUT ------------------ */
#foto, #output {
    margin-top: 15px;
    display: none;
    border-radius: 16px;
    width: 60%;
    max-width: 250px;
}

/* ------------------ STATUS ------------------ */
.status {
    margin-top: 12px;
    font-weight: 700;
    text-align: center;
}

/* ------------------ INFO ------------------ */
.info {
    margin-top: 15px;
    font-size: 14px;
    background: var(--card-bg);
    padding: 12px 18px;
    border-radius: 30px;
}

.info span b {
    color: var(--logo-blue);
}

/* ------------------ BOTÃO ------------------ */
button {
    margin-top: 20px;
    width: 100%;
    max-width: 280px;
    padding: 15px;
    border: none;
    border-radius: 40px;
    background: linear-gradient(135deg, var(--logo-blue), #1976d2);
    color: white;
    font-weight: 700;
    cursor: pointer;
}

/* ------------------ RESPONSIVO ------------------ */
@media (max-width: 600px) {
    main {
        max-width: 95%;
    }

    h3 {
        font-size: 16px;
    }

    .info {
        font-size: 12px;
    }
}
</style>
</head>

<body data-paciente='{{ paciente_id | tojson }}'>
    <header>
        
        <nav>
            <a href="/pacientes">Pacientes</a>
        </nav>
    </header>

    <main>
        
        {% if paciente %}
        <h3>Olá 🤓 <b>{{ paciente["nome"] }}</b>, inicie o atendimento.</h3>
        {% endif %}

        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <img id="foto" style="display:none;">
        <div id="status" class="status">Posicione seu rosto</div>

        <div class="info">
            DP: <span id="dp"><b>0</b></span> mm |
            DNP E: <span id="dnp_e"><b>0</b></span> |
            DNP D: <span id="dnp_d"><b>0</b></span> |
            Score: <span id="score"><b>0</b></span>%
        </div>

        <button onclick="finalizar()">Finalizar</button>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
    // =========================
    let paciente_id = JSON.parse(document.body.dataset.paciente);
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");

    const dpEl = document.getElementById("dp");
    const dnp_eEl = document.getElementById("dnp_e");
    const dnp_dEl = document.getElementById("dnp_d");
    const scoreEl = document.getElementById("score");
    const statusEl = document.getElementById("status");

    let dp_history = [];
    let stableFrames = 0;
    let FOTO_TIRADA = false;
    let PROCESSANDO = true;

    navigator.mediaDevices.getUserMedia({
    video: {
        facingMode: "user"
    }
    })
    .then(stream => video.srcObject = stream)
    .catch(()=> statusEl.innerText = "Erro ao acessar câmera");

    const faceMesh = new FaceMesh({ locateFile: (file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true });

    const L = 468;
    const R = 473;
    let smooth = { lx:null, rx:null, ly:null, ry:null };

    function atualizarCanvasSize(){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
    }
    video.addEventListener('loadedmetadata', atualizarCanvasSize);

    function dentroElipse(x, y, cx, cy, w, h){
        let dx = x - cx;
        let dy = y - cy;
        return ((dx*dx)/(w/2*w/2) + (dy*dy)/(h/2*h/2)) <= 1;
    }

    faceMesh.onResults(results=>{
        if(!PROCESSANDO) return;
        ctx.clearRect(0,0,canvas.width,canvas.height);

        // elipse guia
        ctx.strokeStyle = "rgba(0,172,193,0.3)";
        ctx.lineWidth = 2;
        const guia_cx = canvas.width/2;
        const guia_cy = canvas.height/2;
        const guia_w = canvas.width * 0.4;
        const guia_h = canvas.height * 0.73;
        ctx.beginPath();
        ctx.ellipse(guia_cx, guia_cy, guia_w/2, guia_h/2, 0, 0, 2*Math.PI);
        ctx.stroke();

        if(!results.multiFaceLandmarks.length){
            statusEl.innerText = "Nenhum rosto detectado";
            stableFrames = 0;
            return;
        }

        const lm = results.multiFaceLandmarks[0];
        let lx = lm[L].x * canvas.width;
        let rx = lm[R].x * canvas.width;
        let ly = lm[L].y * canvas.height;
        let ry = lm[R].y * canvas.height;

        if(smooth.lx === null) smooth = { lx, rx, ly, ry };
        smooth.lx = smooth.lx*0.7 + lx*0.3;
        smooth.rx = smooth.rx*0.7 + rx*0.3;
        smooth.ly = smooth.ly*0.7 + ly*0.3;
        smooth.ry = smooth.ry*0.7 + ry*0.3;

        const dentro = dentroElipse(smooth.lx, smooth.ly, guia_cx, guia_cy, guia_w, guia_h) &&
                        dentroElipse(smooth.rx, smooth.ry, guia_cx, guia_cy, guia_w, guia_h);
        if(!dentro){ statusEl.innerText = "Posicione o rosto dentro do círculo"; stableFrames=0; return; }

        const dist = Math.hypot(smooth.rx - smooth.lx, smooth.ly - smooth.ry);
        const faceLeft = lm[234].x * canvas.width;
        const faceRight = lm[454].x * canvas.width;
        const faceWidth = Math.abs(faceRight - faceLeft);
        const escala = 140 / Math.max(faceWidth,1);

        let dp = dist * escala;
        let cx = (smooth.lx + smooth.rx)/2;
        let cy = (smooth.ly + smooth.ry)/2;
        const nx = lm[1].x * canvas.width;
        const ny = lm[1].y * canvas.height;
        cy += (ny - cy)*0.2;

        const dnp_e = Math.abs(smooth.lx - cx) * escala;
        const dnp_d = Math.abs(smooth.rx - cx) * escala;

        dp_history.push(dp);
        if(dp_history.length>10) dp_history.shift();
        dp = dp_history.reduce((a,b)=>a+b,0)/dp_history.length;
        const variacao = Math.max(...dp_history)-Math.min(...dp_history);

        let score = 100 - Math.abs(dp-64)*2;
        score = Math.max(0, Math.min(100, score));

        let status = "";
        if(dp<55) status="Aproxime o rosto";
        else if(dp>75) status="Afaste o rosto";
        else if(score<70) status="Centralize melhor";
        else if(score<90) status="Quase lá...";
        else status="Perfeito! Não se mova";

        if(score>=98 && variacao<2){ stableFrames++; status="Capturando... "+stableFrames; }
        else stableFrames=0;

        if(stableFrames>=15 && !FOTO_TIRADA){ FOTO_TIRADA=true; PROCESSANDO=false; capturarFoto(); }

        statusEl.innerText = status;

        ctx.fillStyle="green";
        ctx.beginPath(); ctx.arc(smooth.lx,smooth.ly,4,0,2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(smooth.rx,smooth.ry,4,0,2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(nx,ny,4,0,2*Math.PI); ctx.fill();

        ctx.strokeStyle="red"; ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(smooth.lx,smooth.ly);
        ctx.lineTo(smooth.rx,smooth.ry);
        ctx.stroke();

        ctx.strokeStyle = score>98?"green":"red";
        ctx.lineWidth=2;
        ctx.strokeRect(canvas.width*0.15, canvas.height*0.13, canvas.width*0.7, canvas.height*0.73);

        dpEl.innerText=dp.toFixed(1);
        dnp_eEl.innerText=dnp_e.toFixed(1);
        dnp_dEl.innerText=dnp_d.toFixed(1);
        scoreEl.innerText=score.toFixed(0);
    });

    new Camera(video,{
        onFrame: async ()=> await faceMesh.send({image:video}),
        width:600,
        height:450
    }).start();

    function capturarFoto(){
    let tempCanvas = document.createElement("canvas");
    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;

    let tctx = tempCanvas.getContext("2d");
    tctx.drawImage(video,0,0);

    let img = tempCanvas.toDataURL("image/jpeg");

    document.getElementById("foto").src = img;
    document.getElementById("foto").style.display="block";

    statusEl.innerText="Foto capturada ✅";

    fetch("/salvar_foto",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ paciente_id, imagem: img })
    });
    }

    async function finalizar(){
        if(!FOTO_TIRADA){ alert("Aguarde a captura da foto!"); return; }
        fetch("/salvar_medicao",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                paciente_id,
                dp: parseFloat(dpEl.innerText),
                dnp_e: parseFloat(dnp_eEl.innerText),
                dnp_d: parseFloat(dnp_dEl.innerText),
                score: parseFloat(scoreEl.innerText)
            })
        }).then(()=> window.location.href="/prontuario/"+paciente_id);
    }
    </script>
</body>
</html>
